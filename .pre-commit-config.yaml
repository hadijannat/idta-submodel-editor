repos:
  - repo: local
    hooks:
      - id: eslint
        name: ESLint
        entry: npm run lint --prefix frontend
        language: system
        types_or: [javascript, typescript, tsx, jsx]
        pass_filenames: false

      - id: typescript
        name: TypeScript Check
        entry: npm run type-check --prefix frontend
        language: system
        types_or: [typescript, tsx]
        pass_filenames: false

      - id: frontend-tests
        name: Frontend Tests
        entry: npm run test:unit --prefix frontend -- --run
        language: system
        types_or: [javascript, typescript, tsx, jsx]
        pass_filenames: false

      - id: pytest
        name: Python Tests
        entry: bash -c 'PYTHONPATH=backend pytest backend/tests -x -q'
        language: system
        types: [python]
        pass_filenames: false
