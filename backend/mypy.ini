[mypy]
python_version = 3.11
show_error_codes = True
warn_unused_ignores = True
warn_redundant_casts = True
ignore_missing_imports = True
files = backend/app
exclude = (?x)(
    ^backend/app/services/magic_import/
  | ^backend/app/services/dataspace/
  | ^backend/app/services/opcua/
  | ^backend/celery_app\.py$
  )
