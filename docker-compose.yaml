services:
  # Backend API service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENV=development
      - DEBUG=true
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - CORS_ORIGINS=["http://localhost:8080","http://localhost:5173"]
      - CACHE_TTL_HOURS=24
      - SECRET_KEY=${SECRET_KEY:-development-secret-key-change-in-production}
      - MAX_UPLOAD_SIZE_MB=50
      - PDF_ENABLED=true
      # OIDC (optional)
      - OIDC_ENABLED=false
      - OIDC_ISSUER_URL=${OIDC_ISSUER_URL:-http://keycloak:8080/realms/idta}
      - OIDC_AUDIENCE=${OIDC_AUDIENCE:-idta-editor}
      # Redis (optional)
      - REDIS_URL=redis://redis:6379
      # Semantic dictionary lookup (optional)
      - SEMANTIC_ENABLED=true
      - SEMANTIC_PREFER_IRI=true
      - SEMANTIC_ECLASS_OFFLINE_ENABLED=true
      - SEMANTIC_IEC_CDD_OFFLINE_ENABLED=true
      - SEMANTIC_ECLASS_ONLINE_ENABLED=${SEMANTIC_ECLASS_ONLINE_ENABLED:-false}
      - ECLASS_API_BASE=${ECLASS_API_BASE:-}
      - ECLASS_SEARCH_URL=${ECLASS_SEARCH_URL:-}
      - ECLASS_RESOLVE_URL=${ECLASS_RESOLVE_URL:-}
      - ECLASS_CERT_PATH=${ECLASS_CERT_PATH:-}
      - ECLASS_KEY_PATH=${ECLASS_KEY_PATH:-}
      - SEMANTIC_CACHE_TTL_SECONDS=${SEMANTIC_CACHE_TTL_SECONDS:-86400}
      - SEMANTIC_SEARCH_RATE_LIMIT_PER_MIN=${SEMANTIC_SEARCH_RATE_LIMIT_PER_MIN:-60}
      - SEMANTIC_RESOLVE_RATE_LIMIT_PER_MIN=${SEMANTIC_RESOLVE_RATE_LIMIT_PER_MIN:-120}
      # Magic Import
      - MAGIC_IMPORT_ENABLED=${MAGIC_IMPORT_ENABLED:-true}
      - MAGIC_IMPORT_LLM_PROVIDER=${MAGIC_IMPORT_LLM_PROVIDER:-openai}
      - MAGIC_IMPORT_LLM_MODEL=${MAGIC_IMPORT_LLM_MODEL:-gpt-4o-mini}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - MAGIC_IMPORT_OCR_ENABLED=true
      - MAGIC_IMPORT_CONFIDENCE_THRESHOLD=0.80
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      # Dataspace
      - DATASPACE_ENABLED=${DATASPACE_ENABLED:-false}
      - VAULT_URL=${VAULT_URL:-http://vault:8200}
      - VAULT_TOKEN=${VAULT_TOKEN:-}
      # Mnestix (browser-accessible URL for AAS Browser iframe)
      - MNESTIX_ENABLED=${MNESTIX_ENABLED:-true}
      - MNESTIX_URL=${MNESTIX_URL:-http://localhost:3001}
    volumes:
      - ./backend/app:/app/app
      - template_cache:/app/cache
      - temp_storage:/app/tmp
      - magic_import_cache:/app/cache/magic_import
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      - redis
    networks:
      - idta-network

  # Frontend development server
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    ports:
      - "8080:8080"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_PORT=8080
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - idta-network

  # Celery worker for background jobs (Magic Import)
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A celery_app worker --loglevel=info --concurrency=2
    environment:
      - ENV=development
      - SECRET_KEY=${SECRET_KEY:-development-secret-key-change-in-production}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - MAGIC_IMPORT_ENABLED=${MAGIC_IMPORT_ENABLED:-true}
      - MAGIC_IMPORT_LLM_PROVIDER=${MAGIC_IMPORT_LLM_PROVIDER:-openai}
      - MAGIC_IMPORT_LLM_MODEL=${MAGIC_IMPORT_LLM_MODEL:-gpt-4o-mini}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - MAGIC_IMPORT_OCR_ENABLED=true
      - MAGIC_IMPORT_CONFIDENCE_THRESHOLD=0.80
    volumes:
      - ./backend/app:/app/app
      - template_cache:/app/cache
      - temp_storage:/app/tmp
      - magic_import_cache:/app/cache/magic_import
    depends_on:
      - redis
    networks:
      - idta-network
    profiles:
      - magic-import  # Only start with: docker compose --profile magic-import up

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - idta-network

  # Keycloak for authentication (optional)
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    command: start-dev
    ports:
      - "${KEYCLOAK_HOST_PORT:-8081}:8080"
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    volumes:
      - keycloak_data:/opt/keycloak/data
    networks:
      - idta-network
    profiles:
      - auth  # Only start with: docker compose --profile auth up

  # ==========================================================================
  # Dataspace Profile Services
  # Start with: docker compose --profile dataspace up
  # ==========================================================================

  # BaSyx AAS Server - Hosts Asset Administration Shell instances
  basyx-aas-server:
    image: eclipsebasyx/aas-server:1.5.1
    container_name: basyx-aas-server
    ports:
      - "4001:4001"
    environment:
      - SERVER_PORT=4001
      - BASYX_AASSERVER_BACKEND=InMemory
      - BASYX_AASSERVER_AASXUPLOAD_ENABLED=true
      - BASYX_AASSERVER_REGISTRY_PATH=http://basyx-registry:4002/api/v1/registry
    volumes:
      - basyx_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4001/shells"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      basyx-registry:
        condition: service_healthy
    networks:
      - idta-network
    profiles:
      - dataspace
      - plc

  # BaSyx AAS Registry - Service discovery for AAS instances
  basyx-registry:
    image: eclipsebasyx/aas-registry:1.5.1
    container_name: basyx-registry
    ports:
      - "4002:4002"
    environment:
      - SERVER_PORT=4002
      - BASYX_REGISTRY_BACKEND=InMemory
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4002/api/v1/registry"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - idta-network
    profiles:
      - dataspace
      - plc

  # Digital Twin Registry (DTR) - Catena-X compliant twin registry
  dtr:
    image: tractusx/sldt-digital-twin-registry:0.4.3
    container_name: dtr
    ports:
      - "4003:4003"
    environment:
      - SERVER_PORT=4003
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-dataspace:5432/dtr
      - SPRING_DATASOURCE_USERNAME=dtr
      - SPRING_DATASOURCE_PASSWORD=dtr_password
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - REGISTRY_IDTYPE_URL=false
      - REGISTRY_ALLOW_ALL_TENANTS=true
    depends_on:
      postgres-dataspace:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4003/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    networks:
      - idta-network
    profiles:
      - dataspace

  # HashiCorp Vault - Secrets management for EDC
  vault:
    image: hashicorp/vault:1.15
    container_name: vault
    ports:
      - "${VAULT_HOST_PORT:-8200}:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=dev-root-token
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
      - VAULT_ADDR=http://0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    volumes:
      - vault_data:/vault/data
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - idta-network
    profiles:
      - dataspace

  # PostgreSQL for EDC and DTR persistence
  postgres-dataspace:
    image: postgres:15-alpine
    container_name: postgres-dataspace
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_password
      - POSTGRES_MULTIPLE_DATABASES=edc,dtr
    volumes:
      - postgres_dataspace_data:/var/lib/postgresql/data
      - ./docker/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - idta-network
    profiles:
      - dataspace

  # EDC Control Plane - Policy management and catalog
  edc-control-plane:
    image: tractusx/edc-controlplane-postgresql-hashicorp-vault:0.7.3
    container_name: edc-control-plane
    ports:
      - "19192:19192"  # Management API
    environment:
      # EDC Identity
      - EDC_PARTICIPANT_ID=${EDC_PARTICIPANT_ID:-BPNL000000000001}
      - EDC_IDS_ID=urn:connector:edc-control-plane
      # API ports
      - WEB_HTTP_PORT=19191
      - WEB_HTTP_PATH=/api
      - WEB_HTTP_MANAGEMENT_PORT=19192
      - WEB_HTTP_MANAGEMENT_PATH=/management
      - WEB_HTTP_PROTOCOL_PORT=19193
      - WEB_HTTP_PROTOCOL_PATH=/protocol
      - WEB_HTTP_PUBLIC_PORT=19194
      - WEB_HTTP_PUBLIC_PATH=/public
      - WEB_HTTP_CONTROL_PORT=19195
      - WEB_HTTP_CONTROL_PATH=/control
      # DSP Protocol
      - EDC_DSP_CALLBACK_ADDRESS=http://edc-control-plane:19193/protocol
      # Data plane
      - EDC_DATAPLANE_SELECTOR_DEFAULTPLANE_URL=http://edc-data-plane:19291/api/dataplane/control
      - EDC_DATAPLANE_SELECTOR_DEFAULTPLANE_SOURCETYPES=HttpData
      - EDC_DATAPLANE_SELECTOR_DEFAULTPLANE_DESTINATIONTYPES=HttpProxy,HttpData
      - EDC_DATAPLANE_SELECTOR_DEFAULTPLANE_PROPERTIES_PUBLICAPIURL=http://edc-data-plane:19291/public
      # Vault
      - EDC_VAULT_HASHICORP_URL=http://vault:8200
      - EDC_VAULT_HASHICORP_TOKEN=dev-root-token
      - EDC_VAULT_HASHICORP_HEALTH_CHECK_ENABLED=false
      # PostgreSQL
      - EDC_DATASOURCE_DEFAULT_URL=jdbc:postgresql://postgres-dataspace:5432/edc
      - EDC_DATASOURCE_DEFAULT_USER=edc
      - EDC_DATASOURCE_DEFAULT_PASSWORD=edc_password
      # API Key
      - EDC_API_AUTH_KEY=${EDC_API_KEY:-edc-api-key}
    depends_on:
      vault:
        condition: service_healthy
      postgres-dataspace:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:19192/management/v2/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - idta-network
    profiles:
      - dataspace

  # EDC Data Plane - Actual data transfer
  edc-data-plane:
    image: tractusx/edc-dataplane-hashicorp-vault:0.7.3
    container_name: edc-data-plane
    ports:
      - "19291:19291"  # Public API
    environment:
      # Data plane ports
      - WEB_HTTP_PORT=19290
      - WEB_HTTP_PATH=/api
      - WEB_HTTP_PUBLIC_PORT=19291
      - WEB_HTTP_PUBLIC_PATH=/public
      - WEB_HTTP_CONTROL_PORT=19292
      - WEB_HTTP_CONTROL_PATH=/control
      # Control plane
      - EDC_CONTROLPLANE_VALIDATION_ENDPOINT=http://edc-control-plane:19195/control/token
      # Vault
      - EDC_VAULT_HASHICORP_URL=http://vault:8200
      - EDC_VAULT_HASHICORP_TOKEN=dev-root-token
      - EDC_VAULT_HASHICORP_HEALTH_CHECK_ENABLED=false
    depends_on:
      edc-control-plane:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:19291/public/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - idta-network
    profiles:
      - dataspace

  # Mnestix AAS Browser - Web UI for browsing AAS
  mnestix:
    image: mnestix/mnestix-browser:2.1.1
    container_name: mnestix
    ports:
      - "3001:3000"
    environment:
      - AAS_REPO_API_URL=http://basyx-aas-server:4001
      - REGISTRY_API_URL=http://basyx-registry:4002
      - SUBMODEL_REGISTRY_API_URL=http://basyx-registry:4002
      - DISCOVERY_API_URL=
      - AAS_LIST_FEATURE_FLAG=true
      - COMPARISON_FEATURE_FLAG=true
      - AUTHENTICATION_FEATURE_FLAG=false
      - LOCK_TIMESERIES_PERIOD_FEATURE_FLAG=true
    depends_on:
      basyx-aas-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - idta-network
    profiles:
      - dataspace

  # ==========================================================================
  # PLC4X Bridge - Industrial PLC to BaSyx AAS Bridge
  # Start with: docker compose --profile plc up
  # Or with dataspace: docker compose --profile dataspace --profile plc up
  # ==========================================================================

  plc4x-bridge:
    build:
      context: ./plc4x-bridge
      dockerfile: Dockerfile
    container_name: plc4x-bridge
    ports:
      - "8090:8090"
    environment:
      # PLC Connection
      - PLC_CONNECTION_STRING=${PLC_CONNECTION_STRING:-simulated://127.0.0.1}
      - PLC_CONNECTION_TIMEOUT=${PLC_CONNECTION_TIMEOUT:-5000}
      - PLC_READ_INTERVAL=${PLC_READ_INTERVAL:-1000}
      - PLC_RETRY_MAX_ATTEMPTS=${PLC_RETRY_MAX_ATTEMPTS:-3}
      - PLC_RETRY_DELAY_MS=${PLC_RETRY_DELAY_MS:-1000}
      # BaSyx AAS Server
      - BASYX_AAS_SERVER_URL=http://basyx-aas-server:4001
      # Mapping configuration
      - MAPPING_UPDATE_MODE=${MAPPING_UPDATE_MODE:-ON_CHANGE}
      - MAPPING_CHANGE_THRESHOLD=${MAPPING_CHANGE_THRESHOLD:-0.01}
      # Logging
      - LOG_LEVEL=${PLC4X_LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    depends_on:
      basyx-aas-server:
        condition: service_healthy
    networks:
      - idta-network
    profiles:
      - plc

volumes:
  template_cache:
    driver: local
  temp_storage:
    driver: local
  redis_data:
    driver: local
  keycloak_data:
    driver: local
  magic_import_cache:
    driver: local
  # Dataspace volumes
  dataspace_cache:
    driver: local
  vault_data:
    driver: local
  postgres_dataspace_data:
    driver: local
  basyx_data:
    driver: local

networks:
  idta-network:
    driver: bridge
