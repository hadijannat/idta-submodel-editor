version: '3.8'

services:
  # Backend API service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENV=development
      - DEBUG=true
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - CORS_ORIGINS=["http://localhost:8080","http://localhost:5173"]
      - CACHE_TTL_HOURS=24
      - SECRET_KEY=${SECRET_KEY:-development-secret-key-change-in-production}
      - MAX_UPLOAD_SIZE_MB=50
      - PDF_ENABLED=true
      # OIDC (optional)
      - OIDC_ENABLED=false
      - OIDC_ISSUER_URL=${OIDC_ISSUER_URL:-http://keycloak:8080/realms/idta}
      - OIDC_AUDIENCE=${OIDC_AUDIENCE:-idta-editor}
      # Redis (optional)
      - REDIS_URL=redis://redis:6379
      # Semantic dictionary lookup (optional)
      - SEMANTIC_ENABLED=true
      - SEMANTIC_PREFER_IRI=true
      - SEMANTIC_ECLASS_OFFLINE_ENABLED=true
      - SEMANTIC_IEC_CDD_OFFLINE_ENABLED=true
      - SEMANTIC_ECLASS_ONLINE_ENABLED=${SEMANTIC_ECLASS_ONLINE_ENABLED:-false}
      - ECLASS_API_BASE=${ECLASS_API_BASE:-}
      - ECLASS_SEARCH_URL=${ECLASS_SEARCH_URL:-}
      - ECLASS_RESOLVE_URL=${ECLASS_RESOLVE_URL:-}
      - ECLASS_CERT_PATH=${ECLASS_CERT_PATH:-}
      - ECLASS_KEY_PATH=${ECLASS_KEY_PATH:-}
      - SEMANTIC_CACHE_TTL_SECONDS=${SEMANTIC_CACHE_TTL_SECONDS:-86400}
      - SEMANTIC_SEARCH_RATE_LIMIT_PER_MIN=${SEMANTIC_SEARCH_RATE_LIMIT_PER_MIN:-60}
      - SEMANTIC_RESOLVE_RATE_LIMIT_PER_MIN=${SEMANTIC_RESOLVE_RATE_LIMIT_PER_MIN:-120}
      # Magic Import
      - MAGIC_IMPORT_ENABLED=true
      - MAGIC_IMPORT_LLM_PROVIDER=${MAGIC_IMPORT_LLM_PROVIDER:-openai}
      - MAGIC_IMPORT_LLM_MODEL=${MAGIC_IMPORT_LLM_MODEL:-gpt-4o-mini}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - MAGIC_IMPORT_OCR_ENABLED=true
      - MAGIC_IMPORT_CONFIDENCE_THRESHOLD=0.80
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./backend/app:/app/app
      - template_cache:/app/cache
      - temp_storage:/app/tmp
      - magic_import_cache:/app/cache/magic_import
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      - redis
    networks:
      - idta-network

  # Frontend development server
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    ports:
      - "8080:8080"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_PORT=8080
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - idta-network

  # Celery worker for background jobs (Magic Import)
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A celery_app worker --loglevel=info --concurrency=2
    environment:
      - ENV=development
      - SECRET_KEY=${SECRET_KEY:-development-secret-key-change-in-production}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - MAGIC_IMPORT_ENABLED=true
      - MAGIC_IMPORT_LLM_PROVIDER=${MAGIC_IMPORT_LLM_PROVIDER:-openai}
      - MAGIC_IMPORT_LLM_MODEL=${MAGIC_IMPORT_LLM_MODEL:-gpt-4o-mini}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - MAGIC_IMPORT_OCR_ENABLED=true
      - MAGIC_IMPORT_CONFIDENCE_THRESHOLD=0.80
    volumes:
      - ./backend/app:/app/app
      - template_cache:/app/cache
      - temp_storage:/app/tmp
      - magic_import_cache:/app/cache/magic_import
    depends_on:
      - redis
    networks:
      - idta-network
    profiles:
      - magic-import  # Only start with: docker-compose --profile magic-import up

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - idta-network

  # Keycloak for authentication (optional)
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    command: start-dev
    ports:
      - "8080:8080"
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    volumes:
      - keycloak_data:/opt/keycloak/data
    networks:
      - idta-network
    profiles:
      - auth  # Only start with: docker-compose --profile auth up

volumes:
  template_cache:
    driver: local
  temp_storage:
    driver: local
  redis_data:
    driver: local
  keycloak_data:
    driver: local
  magic_import_cache:
    driver: local

networks:
  idta-network:
    driver: bridge
