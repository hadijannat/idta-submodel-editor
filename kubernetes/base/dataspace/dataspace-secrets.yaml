apiVersion: v1
kind: Secret
metadata:
  name: dataspace-secrets
  labels:
    app.kubernetes.io/name: idta-submodel-editor
    app.kubernetes.io/component: dataspace-secrets
type: Opaque
stringData:
  # PostgreSQL credentials
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "change-this-postgres-password-in-production"

  # DTR database credentials
  DTR_DB_USER: "dtr"
  DTR_DB_PASSWORD: "change-this-dtr-password-in-production"

  # EDC database credentials
  EDC_DB_USER: "edc"
  EDC_DB_PASSWORD: "change-this-edc-password-in-production"

  # Vault root token (for dev mode only - use proper auth in production)
  VAULT_DEV_ROOT_TOKEN: "dev-root-token-change-in-production"

  # EDC API key
  EDC_API_KEY: "change-this-edc-api-key-in-production"

  # EDC participant ID (BPN)
  EDC_PARTICIPANT_ID: "BPNL000000000001"
