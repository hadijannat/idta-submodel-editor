apiVersion: apps/v1
kind: Deployment
metadata:
  name: mnestix
  labels:
    app.kubernetes.io/name: idta-submodel-editor
    app.kubernetes.io/component: mnestix
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: idta-submodel-editor
      app.kubernetes.io/component: mnestix
  template:
    metadata:
      labels:
        app.kubernetes.io/name: idta-submodel-editor
        app.kubernetes.io/component: mnestix
    spec:
      containers:
      - name: mnestix
        image: mnestix/mnestix-browser:3.2.1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        resources:
          requests:
            memory: "256Mi"
            cpu: "125m"
          limits:
            memory: "512Mi"
            cpu: "250m"
        env:
        - name: AAS_REPO_API_URL
          valueFrom:
            configMapKeyRef:
              name: dataspace-config
              key: BASYX_AAS_SERVER_URL
        - name: REGISTRY_API_URL
          valueFrom:
            configMapKeyRef:
              name: dataspace-config
              key: BASYX_REGISTRY_URL
        - name: SUBMODEL_REGISTRY_API_URL
          valueFrom:
            configMapKeyRef:
              name: dataspace-config
              key: BASYX_REGISTRY_URL
        - name: DISCOVERY_API_URL
          value: ""
        - name: AAS_LIST_FEATURE_FLAG
          valueFrom:
            configMapKeyRef:
              name: dataspace-config
              key: MNESTIX_AAS_LIST_FEATURE
        - name: COMPARISON_FEATURE_FLAG
          valueFrom:
            configMapKeyRef:
              name: dataspace-config
              key: MNESTIX_COMPARISON_FEATURE
        - name: AUTHENTICATION_FEATURE_FLAG
          valueFrom:
            configMapKeyRef:
              name: dataspace-config
              key: MNESTIX_AUTH_FEATURE
        - name: LOCK_TIMESERIES_PERIOD_FEATURE_FLAG
          valueFrom:
            configMapKeyRef:
              name: dataspace-config
              key: MNESTIX_TIMESERIES_FEATURE
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
