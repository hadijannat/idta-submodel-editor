apiVersion: apps/v1
kind: Deployment
metadata:
  name: dtr
  labels:
    app.kubernetes.io/name: idta-submodel-editor
    app.kubernetes.io/component: dtr
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: idta-submodel-editor
      app.kubernetes.io/component: dtr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: idta-submodel-editor
        app.kubernetes.io/component: dtr
    spec:
      containers:
      - name: dtr
        image: tractusx/sldt-digital-twin-registry:0.4.3
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 4003
          name: http
          protocol: TCP
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        env:
        - name: SERVER_PORT
          value: "4003"
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://postgres-dataspace:5432/dtr"
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: dataspace-secrets
              key: DTR_DB_USER
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dataspace-secrets
              key: DTR_DB_PASSWORD
        - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
          value: "org.postgresql.Driver"
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: "update"
        - name: REGISTRY_IDTYPE_URL
          valueFrom:
            configMapKeyRef:
              name: dataspace-config
              key: DTR_ID_TYPE_URL
        - name: REGISTRY_ALLOW_ALL_TENANTS
          valueFrom:
            configMapKeyRef:
              name: dataspace-config
              key: DTR_ALLOW_ALL_TENANTS
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 4003
          initialDelaySeconds: 90
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 4003
          initialDelaySeconds: 45
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 4003
          initialDelaySeconds: 45
          periodSeconds: 5
          failureThreshold: 18
