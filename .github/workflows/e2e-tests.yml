name: E2E Tests

on:
  schedule:
    - cron: '0 2 * * 1-6'
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Test profile to run'
        required: true
        default: 'default'
        type: choice
        options:
          - default
          - magic-import
          - dataspace
          - plc
      suite:
        description: 'Specific suite to run (empty for all)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.schedule || github.event.inputs.profile || github.ref }}
  cancel-in-progress: true

jobs:
  e2e-core:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.profile == 'default')
    uses: ./.github/workflows/_e2e-runner.yml
    secrets: inherit
    with:
      test_command: npm run test:e2e -- --project=chromium
      artifact_name: e2e-core-report
      playwright_install_args: --with-deps chromium

  e2e-magic-import:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.profile == 'magic-import'
    uses: ./.github/workflows/_e2e-runner.yml
    secrets: inherit
    with:
      test_command: npm run test:e2e:magic-import -- --project=chromium
      artifact_name: e2e-magic-import-report
      use_compose: true
      compose_profiles: magic-import
      compose_wait_timeout: 180
      playwright_install_args: --with-deps chromium

  e2e-dataspace:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.profile == 'dataspace'
    uses: ./.github/workflows/_e2e-runner.yml
    secrets: inherit
    with:
      test_command: npm run test:e2e:dataspace -- --project=chromium
      artifact_name: e2e-dataspace-report
      use_compose: true
      compose_profiles: dataspace
      compose_wait_timeout: 300
      playwright_install_args: --with-deps chromium

  e2e-plc:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.profile == 'plc'
    uses: ./.github/workflows/_e2e-runner.yml
    secrets: inherit
    with:
      test_command: npm run test:e2e:plc -- --project=chromium
      artifact_name: e2e-plc-report
      use_compose: true
      compose_profiles: dataspace plc
      compose_wait_timeout: 300
      playwright_install_args: --with-deps chromium

  e2e-cross-browser:
    if: github.event.schedule == '0 2 * * 0'
    strategy:
      matrix:
        browser: [chromium, firefox, webkit]
    uses: ./.github/workflows/_e2e-runner.yml
    secrets: inherit
    with:
      test_command: npm run test:e2e:smoke -- --project=${{ matrix.browser }}
      artifact_name: e2e-report-${{ matrix.browser }}
      playwright_install_args: --with-deps
