name: Fixture Refresh

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  refresh-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Install aas-test-engines
        run: pip install aas-test-engines

      - name: Generate fixtures
        env:
          SECRET_KEY: ${{ secrets.FIXTURE_SECRET_KEY }}
        run: |
          if [ -z "$SECRET_KEY" ]; then
            echo "Missing FIXTURE_SECRET_KEY secret." >&2
            exit 1
          fi
          PYTHONPATH=backend python backend/tests/fixtures/generate_fixtures.py

      - name: Check for changes
        id: git-check
        run: |
          if git status --porcelain | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate PR token
        if: steps.git-check.outputs.changed == 'true'
        env:
          FIXTURE_PR_TOKEN: ${{ secrets.FIXTURE_PR_TOKEN }}
        run: |
          if [ -z "$FIXTURE_PR_TOKEN" ]; then
            echo "Missing FIXTURE_PR_TOKEN secret (PAT with repo and workflow scopes)." >&2
            exit 1
          fi

      - name: Create PR
        if: steps.git-check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          # Use a PAT so downstream pull_request workflows are triggered.
          token: ${{ secrets.FIXTURE_PR_TOKEN }}
          commit-message: "chore: refresh AAS fixtures"
          title: "chore: refresh AAS fixtures"
          body: "Automated fixture refresh from scheduled workflow."
          branch: "chore/refresh-aas-fixtures"
