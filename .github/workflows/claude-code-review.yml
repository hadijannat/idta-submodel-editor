name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1

      # External SDK/plugin failures are intermittent and outside repo code quality.
      # Keep this review signal, but prevent infrastructure flakiness from blocking PRs.
      - name: Run Claude Code Review (attempt 1)
        id: claude-review-attempt-1
        continue-on-error: true
        uses: anthropics/claude-code-action@6e2bd52842c65e914eba5c8badd17560bd26b5de
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          show_full_output: false
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      - name: Run Claude Code Review (attempt 2)
        id: claude-review-attempt-2
        if: steps.claude-review-attempt-1.outcome == 'failure'
        continue-on-error: true
        uses: anthropics/claude-code-action@6e2bd52842c65e914eba5c8badd17560bd26b5de
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'

      - name: Report Claude review instability
        if: >
          steps.claude-review-attempt-1.outcome == 'failure' &&
          (steps.claude-review-attempt-2.outcome == 'failure' || steps.claude-review-attempt-2.outcome == '')
        run: |
          echo "::warning::Claude review action failed after retries due external runtime/plugin instability. This check is non-blocking."
