name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Evaluate Claude trigger
        id: trigger
        shell: bash
        run: |
          set -euo pipefail
          SHOULD_RUN="false"
          EVENT="${GITHUB_EVENT_NAME}"
          PAYLOAD="${GITHUB_EVENT_PATH}"
          TEXT=""
          ASSOCIATION=""

          case "${EVENT}" in
            issue_comment|pull_request_review_comment)
              TEXT="$(jq -r '.comment.body // ""' "${PAYLOAD}")"
              ASSOCIATION="$(jq -r '.comment.author_association // ""' "${PAYLOAD}")"
              ;;
            pull_request_review)
              TEXT="$(jq -r '.review.body // ""' "${PAYLOAD}")"
              ASSOCIATION="$(jq -r '.review.author_association // ""' "${PAYLOAD}")"
              ;;
            issues)
              TEXT="$(jq -r '(.issue.title // "") + "\n" + (.issue.body // "")' "${PAYLOAD}")"
              ASSOCIATION="$(jq -r '.issue.author_association // ""' "${PAYLOAD}")"
              ;;
          esac

          if echo "${TEXT}" | grep -qi '@claude'; then
            case "${ASSOCIATION}" in
              OWNER|MEMBER|COLLABORATOR)
                SHOULD_RUN="true"
                ;;
            esac
          fi

          echo "should_run=${SHOULD_RUN}" >> "${GITHUB_OUTPUT}"

      - name: Run Claude Code (attempt 1)
        if: steps.trigger.outputs.should_run == 'true'
        id: claude-attempt-1
        continue-on-error: true
        uses: anthropics/claude-code-action@ba7fa4bcf054319261202aef93d71a89112a8d00
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # claude_args: '--allowed-tools Bash(gh pr:*)'

      - name: Run Claude Code (attempt 2)
        if: steps.trigger.outputs.should_run == 'true' && steps.claude-attempt-1.outcome == 'failure'
        id: claude-attempt-2
        continue-on-error: true
        uses: anthropics/claude-code-action@ba7fa4bcf054319261202aef93d71a89112a8d00
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

      - name: No-op when Claude is not requested
        if: steps.trigger.outputs.should_run != 'true'
        run: echo "No @claude trigger found; marking workflow as successful no-op."

      - name: Report Claude runtime instability
        if: >
          steps.trigger.outputs.should_run == 'true' &&
          steps.claude-attempt-1.outcome == 'failure' &&
          (steps.claude-attempt-2.outcome == 'failure' || steps.claude-attempt-2.outcome == '')
        run: |
          echo "::warning::Claude workflow failed after retries due external action/runtime instability. Marking as non-blocking."
