name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest-cov

      - name: Run backend tests with coverage
        run: |
          PYTHONPATH=backend pytest backend/tests \
            --cov=backend/app \
            --cov-report=xml \
            --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

  frontend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Type-check
        run: npm run type-check
        working-directory: frontend

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run tests
        run: npm run test:unit -- --coverage
        working-directory: frontend

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/

  frontend-build:
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-typecheck, frontend-test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  aas-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install aas-test-engines
        run: |
          python -m pip install --upgrade pip
          pip install aas-test-engines

      - name: Run AAS conformance checks
        run: |
          set -e
          has_files=false
          if [ -d backend/tests/fixtures/aasx ]; then
            for file in backend/tests/fixtures/aasx/*.aasx; do
              [ -e "$file" ] || continue
              has_files=true
              aas_test_engines check_file --format aasx "$file"
            done
          fi
          if [ -d backend/tests/fixtures/json ]; then
            for file in backend/tests/fixtures/json/*.json; do
              [ -e "$file" ] || continue
              has_files=true
              aas_test_engines check_file --format json "$file"
            done
          fi
          if [ "$has_files" = false ]; then
            echo "No fixture files found; skipping conformance checks."
          fi

  # E2E Smoke Tests - Run on every PR
  e2e-smoke:
    runs-on: ubuntu-latest
    needs: [frontend-build, backend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Set up Python for conformance tool
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install aas-test-engines
        run: pip install aas-test-engines

      - name: Set up backend
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Start backend server
        run: |
          cd backend && uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          # Wait for backend to be healthy
          for i in {1..30}; do
            curl -s http://localhost:8000/health && break
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and serve frontend
        run: |
          cd frontend && npm run build
          npx serve -s dist -l 8080 &
          # Wait for frontend to be ready
          for i in {1..15}; do
            curl -s http://localhost:8080 && break
            echo "Waiting for frontend... ($i/15)"
            sleep 2
          done

      - name: Warm up template cache
        run: |
          # Fetch Digital Nameplate schema to prime cache
          curl -s "http://localhost:8000/api/editor/templates/Digital%20Nameplate/schema" > /dev/null || true
          sleep 2
        continue-on-error: true

      - name: Run E2E smoke tests
        run: npm run test:e2e:smoke -- --project=chromium
        working-directory: frontend
        env:
          DEMO_BASE_URL: http://localhost:8080
          VITE_API_URL: http://localhost:8000
          CI: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-smoke-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
