name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      frontend_lockfile: ${{ steps.filter.outputs.frontend_lockfile }}
      plc4x: ${{ steps.filter.outputs.plc4x }}
      docker: ${{ steps.filter.outputs.docker }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            frontend_lockfile:
              - 'frontend/package-lock.json'
            plc4x:
              - 'plc4x-bridge/**'
            docker:
              - 'backend/Dockerfile'
              - 'frontend/Dockerfile'
              - 'plc4x-bridge/Dockerfile'
              - 'docker-compose.yml'
              - 'docker-compose.yaml'
              - 'docker-compose.*'
            workflows:
              - '.github/workflows/**'
              - '.github/actions/**'

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest-cov

      - name: Run backend tests with coverage
        run: |
          PYTHONPATH=backend pytest backend/tests \
            --cov=backend/app \
            --cov-report=xml \
            --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml

  backend-typecheck:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run mypy baseline
        run: |
          set -o pipefail
          PYTHONPATH=backend mypy --config-file backend/mypy.ini | tee backend-mypy-report.txt

      - name: Upload mypy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-mypy-report
          path: backend-mypy-report.txt

  backend-lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run backend lint baseline
        run: |
          set -o pipefail
          ruff check backend/app backend/tests | tee backend-ruff-report.txt

      - name: Upload ruff report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-ruff-report
          path: backend-ruff-report.txt

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

  frontend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Type-check
        run: npm run type-check
        working-directory: frontend

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run tests
        run: npm run test:unit -- --coverage
        working-directory: frontend

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/

  frontend-lockfile-audit:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend_lockfile == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run high-severity audit gate
        run: npm audit --audit-level=high
        working-directory: frontend

  frontend-build:
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-typecheck, frontend-test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Upload built frontend
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  aas-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install aas-test-engines
        run: |
          python -m pip install --upgrade pip
          pip install aas-test-engines

      - name: Run AAS conformance checks
        env:
          CONFORMANCE_REQUIRED_BRANCHES: ${{ vars.CONFORMANCE_REQUIRED_BRANCHES }}
        run: |
          set -e
          has_files=false
          target_branch="${GITHUB_BASE_REF:-${GITHUB_REF_NAME:-}}"
          default_branch="${{ github.event.repository.default_branch }}"
          required_branches_csv="${CONFORMANCE_REQUIRED_BRANCHES:-$default_branch}"
          protected_target=false
          for branch in $(echo "$required_branches_csv" | tr ',' ' '); do
            branch="$(echo "$branch" | xargs)"
            [ -n "$branch" ] || continue
            if [ "$target_branch" = "$branch" ]; then
              protected_target=true
              break
            fi
          done
          if [ -d backend/tests/fixtures/aasx ]; then
            for file in backend/tests/fixtures/aasx/*.aasx; do
              [ -e "$file" ] || continue
              has_files=true
              aas_test_engines check_file --format aasx "$file"
            done
          fi
          if [ -d backend/tests/fixtures/json ]; then
            for file in backend/tests/fixtures/json/*.json; do
              [ -e "$file" ] || continue
              has_files=true
              aas_test_engines check_file --format json "$file"
            done
          fi
          if [ "$has_files" = false ]; then
            if [ "$protected_target" = true ]; then
              echo "Conformance fixtures are required for protected-target branches: $required_branches_csv."
              exit 1
            fi
            echo "No fixture files found; skipping conformance checks (branch '$target_branch' not in '$required_branches_csv')."
          fi

  e2e-smoke:
    needs: [frontend-build, backend]
    uses: ./.github/workflows/_e2e-runner.yml
    secrets: inherit
    with:
      test_command: npm run test:e2e:smoke -- --project=chromium
      artifact_name: e2e-smoke-report
      frontend_dist_artifact: frontend-dist
      playwright_install_args: --with-deps chromium

  plc4x-bridge:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.plc4x == 'true' || needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run PLC4X bridge tests
        run: mvn -B -f plc4x-bridge/pom.xml test

  docker-build:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.plc4x == 'true' || needs.changes.outputs.docker == 'true' || needs.changes.outputs.workflows == 'true'
    env:
      BUILD_BACKEND_IMAGE: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.docker == 'true' || needs.changes.outputs.workflows == 'true' }}
      BUILD_FRONTEND_IMAGE: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.docker == 'true' || needs.changes.outputs.workflows == 'true' }}
      BUILD_PLC4X_IMAGE: ${{ needs.changes.outputs.plc4x == 'true' || needs.changes.outputs.docker == 'true' || needs.changes.outputs.workflows == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker compose configuration
        run: docker compose -f docker-compose.yaml config > /dev/null

      - name: Build backend image
        if: env.BUILD_BACKEND_IMAGE == 'true'
        run: docker build -t idta-backend:ci ./backend

      - name: Build frontend image
        if: env.BUILD_FRONTEND_IMAGE == 'true'
        run: docker build -t idta-frontend:ci --build-arg VITE_API_URL=http://localhost:8000 ./frontend

      - name: Build plc4x image
        if: env.BUILD_PLC4X_IMAGE == 'true'
        run: docker build -t idta-plc4x-bridge:ci ./plc4x-bridge

      - name: Smoke test plc4x image startup
        if: env.BUILD_PLC4X_IMAGE == 'true'
        run: |
          set -euo pipefail
          cid=$(docker run -d --rm -p 18090:8090 idta-plc4x-bridge:ci)
          cleanup() {
            docker logs "$cid" || true
            docker rm -f "$cid" || true
          }
          trap cleanup EXIT
          for i in {1..24}; do
            if curl -fsS http://localhost:18090/actuator/health > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "plc4x image health endpoint did not become ready in time"
          exit 1
