name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      frontend_lockfile: ${{ steps.filter.outputs.frontend_lockfile }}
      plc4x: ${{ steps.filter.outputs.plc4x }}
      docker: ${{ steps.filter.outputs.docker }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Detect changed paths
        id: filter
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/compute_changed_paths.py

  workflow-lint:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install YAML lint tool
        run: |
          python -m pip install --upgrade pip
          pip install yamllint

      - name: Lint GitHub workflow files
        run: |
          yamllint -d "{extends: default, rules: {line-length: disable, truthy: disable, document-start: disable, comments: disable}}" \
            .github/workflows

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.11
          ACTIONLINT_SHA256: 900919a84f2229bac68ca9cd4103ea297abc35e9689ebb842c6e34a3d1b01b0a
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          curl -fsSL -o "${RUNNER_TEMP}/${archive}" "${url}"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" actionlint
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Run actionlint
        run: actionlint

      - name: Test workflow helpers
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify secure Pillow resolution
        run: |
          python - <<'PY'
          import re
          from PIL import __version__ as pillow_version

          parts = tuple(int(token) for token in re.findall(r"\d+", pillow_version)[:3])
          if parts < (12, 1, 1) or parts >= (13, 0, 0):
              raise SystemExit(
                  f"Pillow {pillow_version} is outside the supported secure range [12.1.1, 13.0.0)"
              )
          print(f"Using Pillow {pillow_version}")
          PY

      - name: Verify secure cryptography resolution
        run: |
          python - <<'PY'
          import re
          from cryptography import __version__ as cryptography_version

          parts = tuple(int(token) for token in re.findall(r"\d+", cryptography_version)[:3])
          if parts < (47, 0, 0) or parts >= (48, 0, 0):
              raise SystemExit(
                  f"cryptography {cryptography_version} is outside the supported secure range [47.0.0, 48.0.0)"
              )
          print(f"Using cryptography {cryptography_version}")
          PY

      - name: Run backend tests with coverage
        run: |
          PYTHONPATH=backend pytest backend/tests \
            --cov=backend/app \
            --cov-report=xml \
            --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: coverage.xml

  backend-python314:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.docker == 'true' || needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend tests on Python 3.14
        run: PYTHONPATH=backend pytest backend/tests

  backend-typecheck:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run mypy baseline
        run: |
          set -o pipefail
          PYTHONPATH=backend mypy --config-file backend/mypy.ini | tee backend-mypy-report.txt

      - name: Upload mypy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-mypy-report
          path: backend-mypy-report.txt

  backend-lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run backend lint baseline
        run: |
          set -o pipefail
          ruff check backend/app backend/tests | tee backend-ruff-report.txt

      - name: Upload ruff report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-ruff-report
          path: backend-ruff-report.txt

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '25'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

  frontend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '25'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Type-check
        run: npm run type-check
        working-directory: frontend

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '25'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run tests
        run: npm run test:unit -- --coverage
        working-directory: frontend

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/

  frontend-runtime-floor:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20.19.0'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Verify frontend toolchain floor
        run: |
          npm run type-check
          npm run test:unit
          npm run build
        working-directory: frontend

  frontend-lockfile-audit:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend_lockfile == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '25'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run high-severity audit gate
        run: npm audit --audit-level=high
        working-directory: frontend

  frontend-build:
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-typecheck, frontend-test]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '25'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Upload built frontend
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist

  aas-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install aas-test-engines
        run: |
          python -m pip install --upgrade pip
          pip install aas-test-engines

      - name: Run AAS conformance checks
        env:
          CONFORMANCE_REQUIRED_BRANCHES: ${{ vars.CONFORMANCE_REQUIRED_BRANCHES }}
        run: |
          set -e
          has_files=false
          target_branch="${GITHUB_BASE_REF:-${GITHUB_REF_NAME:-}}"
          default_branch="${{ github.event.repository.default_branch }}"
          required_branches_csv="${CONFORMANCE_REQUIRED_BRANCHES:-$default_branch}"
          protected_target=false
          for branch in $(echo "$required_branches_csv" | tr ',' ' '); do
            branch="$(echo "$branch" | xargs)"
            [ -n "$branch" ] || continue
            if [ "$target_branch" = "$branch" ]; then
              protected_target=true
              break
            fi
          done
          if [ -d backend/tests/fixtures/aasx ]; then
            for file in backend/tests/fixtures/aasx/*.aasx; do
              [ -e "$file" ] || continue
              has_files=true
              aas_test_engines check_file --format aasx "$file"
            done
          fi
          if [ -d backend/tests/fixtures/json ]; then
            for file in backend/tests/fixtures/json/*.json; do
              [ -e "$file" ] || continue
              has_files=true
              aas_test_engines check_file --format json "$file"
            done
          fi
          if [ "$has_files" = false ]; then
            if [ "$protected_target" = true ]; then
              echo "Conformance fixtures are required for protected-target branches: $required_branches_csv."
              exit 1
            fi
            echo "No fixture files found; skipping conformance checks (branch '$target_branch' not in '$required_branches_csv')."
          fi

  e2e-smoke:
    needs: [frontend-build, backend]
    uses: ./.github/workflows/_e2e-runner.yml
    secrets: inherit
    with:
      test_command: npm run test:e2e:smoke -- --project=chromium
      artifact_name: e2e-smoke-report
      frontend_dist_artifact: frontend-dist
      playwright_install_args: --with-deps chromium

  e2e-regression:
    needs: [changes, frontend-build, backend]
    if: needs.changes.outputs.frontend_lockfile == 'true'
    uses: ./.github/workflows/_e2e-runner.yml
    secrets: inherit
    with:
      test_command: npm run test:e2e -- --project=chromium
      artifact_name: e2e-regression-report
      frontend_dist_artifact: frontend-dist
      playwright_install_args: --with-deps chromium

  plc4x-bridge:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.plc4x == 'true' || needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run PLC4X bridge tests
        run: mvn -B -f plc4x-bridge/pom.xml test

  docker-build:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.plc4x == 'true' || needs.changes.outputs.docker == 'true' || needs.changes.outputs.workflows == 'true'
    env:
      BUILD_BACKEND_IMAGE: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.docker == 'true' || needs.changes.outputs.workflows == 'true' }}
      BUILD_FRONTEND_IMAGE: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.docker == 'true' || needs.changes.outputs.workflows == 'true' }}
      BUILD_PLC4X_IMAGE: ${{ needs.changes.outputs.plc4x == 'true' || needs.changes.outputs.docker == 'true' || needs.changes.outputs.workflows == 'true' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Validate docker compose configuration
        run: docker compose -f docker-compose.yaml config > /dev/null

      - name: Build backend image
        if: env.BUILD_BACKEND_IMAGE == 'true'
        run: docker build -t idta-backend:ci ./backend

      - name: Smoke test backend image startup
        if: env.BUILD_BACKEND_IMAGE == 'true'
        run: |
          set -euo pipefail
          cid=$(docker run -d -p 18000:8000 \
            -e SECRET_KEY=ci-smoke-test-secret-key-at-least-thirty-two-characters \
            -e ALLOW_INSECURE_PROD_AUTH=true \
            idta-backend:ci)
          trap 'docker logs "$cid" || true; docker rm -f "$cid" || true' EXIT
          for _ in {1..24}; do
            status=$(docker inspect -f '{{.State.Status}}' "$cid")
            if [ "$status" != "running" ]; then
              echo "backend image exited before readiness checks completed"
              docker logs "$cid" || true
              exit 1
            fi
            if curl -fsS http://localhost:18000/health > /dev/null && \
               curl -fsS http://localhost:18000/metrics > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "backend image health/metrics endpoints did not become ready in time"
          exit 1

      - name: Smoke test backend worker entrypoint
        if: env.BUILD_BACKEND_IMAGE == 'true'
        run: |
          set -euo pipefail
          docker run --rm \
            -e SECRET_KEY=ci-smoke-test-secret-key-at-least-thirty-two-characters \
            -e ALLOW_INSECURE_PROD_AUTH=true \
            -e CELERY_BROKER_URL=redis://localhost:6379/0 \
            -e CELERY_RESULT_BACKEND=redis://localhost:6379/0 \
            idta-backend:ci python -c 'from celery_app import celery_app; assert celery_app.main == "idta_submodel_editor"'
          docker run --rm \
            -e SECRET_KEY=ci-smoke-test-secret-key-at-least-thirty-two-characters \
            -e ALLOW_INSECURE_PROD_AUTH=true \
            -e CELERY_BROKER_URL=redis://localhost:6379/0 \
            -e CELERY_RESULT_BACKEND=redis://localhost:6379/0 \
            idta-backend:ci celery -A celery_app worker --help >/dev/null

      - name: Smoke test backend worker with Redis
        if: env.BUILD_BACKEND_IMAGE == 'true'
        run: |
          set -euo pipefail
          network="idta-celery-smoke-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-0}"
          worker_cid=""
          redis_cid=""

          cleanup() {
            if [ -n "$worker_cid" ]; then
              docker logs "$worker_cid" || true
            fi
            docker rm -f "$worker_cid" "$redis_cid" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker network create "$network" >/dev/null
          redis_cid=$(docker run -d --network "$network" --network-alias redis redis:7-alpine)
          for _ in {1..30}; do
            if docker exec "$redis_cid" redis-cli ping | grep -q PONG; then
              break
            fi
            sleep 1
          done
          if ! docker exec "$redis_cid" redis-cli ping | grep -q PONG; then
            echo "redis did not become ready for celery smoke test"
            exit 1
          fi

          worker_cid=$(docker run -d --network "$network" \
            -e SECRET_KEY=ci-smoke-test-secret-key-at-least-thirty-two-characters \
            -e ALLOW_INSECURE_PROD_AUTH=true \
            -e CELERY_BROKER_URL=redis://redis:6379/0 \
            -e CELERY_RESULT_BACKEND=redis://redis:6379/0 \
            idta-backend:ci celery -A celery_app worker --loglevel=info --concurrency=1)
          worker_ready=false
          for _ in {1..30}; do
            if [ "$(docker inspect -f '{{.State.Running}}' "$worker_cid")" != "true" ]; then
              echo "celery worker exited before readiness checks completed"
              exit 1
            fi
            if docker run --rm --network "$network" \
              -e SECRET_KEY=ci-smoke-test-secret-key-at-least-thirty-two-characters \
              -e ALLOW_INSECURE_PROD_AUTH=true \
              -e CELERY_BROKER_URL=redis://redis:6379/0 \
              -e CELERY_RESULT_BACKEND=redis://redis:6379/0 \
              idta-backend:ci celery -A celery_app inspect ping --timeout=2 >/dev/null 2>&1; then
              worker_ready=true
              break
            fi
            sleep 2
          done
          if [ "$worker_ready" != "true" ]; then
            echo "celery worker did not answer inspect ping in time"
            exit 1
          fi

          docker run --rm -i --network "$network" \
            -e SECRET_KEY=ci-smoke-test-secret-key-at-least-thirty-two-characters \
            -e ALLOW_INSECURE_PROD_AUTH=true \
            -e CELERY_BROKER_URL=redis://redis:6379/0 \
            -e CELERY_RESULT_BACKEND=redis://redis:6379/0 \
            idta-backend:ci python - <<'PY'
          from celery_app import celery_app

          result = celery_app.send_task("magic_import.health_check")
          payload = result.get(timeout=20)
          assert payload["status"] == "healthy", payload
          print(payload)
          PY

      - name: Build frontend image
        if: env.BUILD_FRONTEND_IMAGE == 'true'
        run: docker build -t idta-frontend:ci --build-arg VITE_API_URL=http://localhost:8000 ./frontend

      - name: Build frontend development target
        if: env.BUILD_FRONTEND_IMAGE == 'true'
        run: docker build --target development -t idta-frontend:ci-development --build-arg VITE_API_URL=http://localhost:8000 ./frontend

      - name: Build plc4x image
        if: env.BUILD_PLC4X_IMAGE == 'true'
        run: docker build -t idta-plc4x-bridge:ci ./plc4x-bridge

      - name: Smoke test plc4x image startup
        if: env.BUILD_PLC4X_IMAGE == 'true'
        run: |
          set -euo pipefail
          cid=$(docker run -d --rm -p 18090:8090 idta-plc4x-bridge:ci)
          trap 'docker logs "$cid" || true; docker rm -f "$cid" || true' EXIT
          for _ in {1..24}; do
            if curl -fsS http://localhost:18090/actuator/health > /dev/null && \
               (curl -fsS http://localhost:18090/v3/api-docs > /dev/null || \
                curl -fsS http://localhost:18090/api-docs > /dev/null); then
              exit 0
            fi
            sleep 5
          done
          echo "plc4x image health/docs endpoints did not become ready in time"
          exit 1
